<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel de Gestão - Traços Culturais | Clean Edition</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  
  <style>
    /* VARIÁVEIS DE COR PARA TEMA MINIMALISTA E CLARO */
    :root {
      --bg-light: #f9f9f9;
      --bg-card: white;
      --text-dark: #333;
      --accent-color: #007bff; /* Azul primário (clean) */
      --header-color: #f1f1f1;
      --border-color: #e0e0e0;
      --reserved-color: #dc3545; /* Vermelho padrão */
      --confirmed-color: #28a745; /* Verde padrão */
    }
    body {
      font-family: 'Helvetica Neue', Arial, sans-serif;
      background-color: var(--bg-light);
      color: var(--text-dark);
      padding: 20px;
      line-height: 1.6;
    }
    .container {
      max-width: 1300px;
      margin: 0 auto;
      background: var(--bg-card);
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }
    h1 {
      color: var(--text-dark);
      text-align: left;
      margin-bottom: 25px;
      font-weight: 300;
      font-size: 2em;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 10px;
    }
    
    /* BARRA DE AÇÕES (Busca e PDF) */
    .actions-bar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 25px;
        gap: 20px;
    }
    .search-area {
        position: relative;
        flex-grow: 1;
    }
    #search-input {
      width: 100%;
      padding: 10px 10px 10px 45px;
      border: 1px solid var(--border-color);
      background-color: var(--bg-card);
      color: var(--text-dark);
      border-radius: 4px;
      box-sizing: border-box;
      font-size: 1rem;
      transition: border-color 0.2s;
    }
    #search-input:focus {
        border-color: var(--accent-color);
        outline: none;
    }
    .search-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        font-size: 1.2rem;
        color: #777;
    }
    .pdf-button {
        background-color: var(--reserved-color);
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        transition: background-color 0.2s, transform 0.1s;
    }
    .pdf-button:hover {
        background-color: #c82333;
        transform: translateY(-1px);
    }

    /* ESTILOS DA TABELA */
    #reservasTable {
      width: 100%;
      border-collapse: collapse;
      margin-top: 15px;
      background: var(--bg-card);
      border-radius: 4px;
      overflow: hidden;
      border: 1px solid var(--border-color);
    }
    #reservasTable th, #reservasTable td {
      padding: 12px 15px;
      text-align: left;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }
    #reservasTable th {
      background-color: var(--header-color);
      color: var(--text-dark);
      font-weight: 600;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      letter-spacing: 0.5px;
    }
    #reservasTable th:hover {
      background-color: #e9e9e9;
    }
    #reservasTable tbody tr:hover {
      background-color: #f5f5f5;
    }
    
    /* Indicadores de Ordenação */
    .sort-asc::after { color: var(--accent-color); content: ' ▲'; font-size: 0.8em; }
    .sort-desc::after { color: var(--accent-color); content: ' ▼'; font-size: 0.8em; }

    /* Estilos de Status e Ação */
    .status-badge {
        display: inline-block;
        padding: 5px 10px;
        border-radius: 4px;
        font-weight: bold;
        font-size: 0.8rem;
    }
    .status-pendente {
        background-color: #ffe0b2; /* Laranja claro */
        color: var(--reserved-color);
    }
    .status-confirmado {
        background-color: #c8e6c9; /* Verde claro */
        color: var(--confirmed-color);
    }

    .confirm-button {
        background-color: var(--accent-color);
        color: white;
        border: none;
        padding: 8px 15px;
        border-radius: 4px;
        cursor: pointer;
        font-weight: 600;
        font-size: 0.85rem;
        transition: background-color 0.2s;
    }
    .confirm-button:hover {
        background-color: #0056b3;
    }

    .total-reservas {
      font-weight: bold;
      margin-bottom: 15px;
      text-align: center;
      font-size: 1.2rem;
      padding: 15px;
      background-color: #e0f7fa; /* Azul claro suave */
      border-radius: 4px;
      color: #00796b;
      border: 1px solid #b2ebf2;
    }
    .loading-text {
        color: #666;
        font-size: 1.1rem;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Gestão de Reservas</h1>
    
    <div class="actions-bar">
        <div class="search-area">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" placeholder="Buscar por Aluno, Turma, Mesa..." onkeyup="filtrarTabela()">
        </div>
        <button class="pdf-button" onclick="exportarPDF()">⬇️ Baixar Relatório (PDF)</button>
    </div>

    <div class="total-reservas">Total de Mesas no Painel: <span id="totalReservas">0</span></div>
    
    <div id="loading" class="loading-text" style="text-align: center;">Carregando dados...</div>
    
    <table id="reservasTable">
      <thead>
        <tr>
          <th data-column-index="0" class="sortable">Mesa(s)</th>
          <th data-column-index="1" class="sortable">Responsável</th>
          <th data-column-index="2" class="sortable">Aluno / Turma</th>
          <th data-column-index="3" class="sortable">Valor (R$)</th>
          <th data-column-index="4" class="sortable sort-desc">Data/Hora</th>
          <th>Status</th>
          <th>Ação</th>
        </tr>
      </thead>
      <tbody>
        </tbody>
    </table>
  </div>

  <script type="module">
    // *** CÓDIGO JAVASCRIPT CORRIGIDO ***

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import { getDatabase, ref, onValue, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

    // Sua Configuração Exata do Firebase
const firebaseConfig = {
      apiKey: "AIzaSyCmuuPAX68dOcESWMFdynI56j_GYkosEmg",
      authDomain: "reservas-tracos-culturais.firebaseapp.com",
      databaseURL: "https://reservas-tracos-culturais-default-rtdb.firebaseio.com",
      projectId: "reservas-tracos-culturais",
      storageBucket: "reservas-tracos-culturais.appspot.com",
      messagingSenderId: "53243907823",
      appId: "1:53243907823:web:1eee06470fe6554f0b551a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const tbody = document.querySelector('#reservasTable tbody');
    const loadingDiv = document.getElementById('loading');
    const totalReservasSpan = document.getElementById('totalReservas');
    const searchInput = document.getElementById('search-input');
    const headers = document.querySelectorAll('#reservasTable th.sortable');
    
    let dadosAgrupados = [];
    let sortColumn = 4; // Novo índice padrão: Data/Hora
    let sortDirection = 'desc';

    // ----------------------------------------------------
    // FUNÇÕES DE FILTRAGEM E ORDENAÇÃO (CORRIGIDAS)
    // ----------------------------------------------------

    window.filtrarTabela = function() {
      const termo = searchInput.value.toLowerCase();
      const linhas = tbody.querySelectorAll('tr');

      let mesasVisiveis = 0;
      linhas.forEach(row => {
        const textoLinha = row.textContent.toLowerCase();
        const isVisible = textoLinha.includes(termo);
        row.style.display = isVisible ? '' : 'none';
        
        if(isVisible) {
            const mesasText = row.querySelector('td:first-child').textContent;
            mesasVisiveis += mesasText.split(',').length;
        }
      });
      totalReservasSpan.textContent = mesasVisiveis.toString();
    }

    function ordenarTabela(index, direction) {
        headers.forEach(h => {
            h.classList.remove('sort-asc', 'sort-desc');
        });

        headers[index].classList.add(direction === 'asc' ? 'sort-asc' : 'sort-desc');

        dadosAgrupados.sort((a, b) => {
            let aVal, bVal;
            
            // ÍNDICES DO SWITCH ATUALIZADOS
            switch (index) {
                case 0: aVal = parseInt(a.mesas[0]); bVal = parseInt(b.mesas[0]); break; // Mesa
                case 1: aVal = a.nome; bVal = b.nome; break; // Responsável
                case 2: aVal = a.aluno; bVal = b.aluno; break; // Aluno/Turma
                case 3: aVal = a.valorTotal; bVal = b.valorTotal; break; // Valor
                case 4: // Data/Hora
                default:
                    const aDate = new Date(`${a.data.split('/').reverse().join('-')}T${a.horario}:00`);
                    const bDate = new Date(`${b.data.split('/').reverse().join('-')}T${b.horario}:00`);
                    return direction === 'asc' ? aDate - bDate : bDate - aDate;
            }

            if (index === 4) return 0; // Data/Hora já ordenada

            if (typeof aVal === 'number') {
                return direction === 'asc' ? aVal - bVal : bVal - aVal;
            } else {
                return direction === 'asc' ? aVal.localeCompare(bVal) : bVal.localeCompare(aVal);
            }
        });

        renderizarTabela(dadosAgrupados);
    }
    
    function renderizarTabela(reservas) {
        tbody.innerHTML = '';
        let totalMesas = 0; 
        
        reservas.forEach(reserva => {
            const row = tbody.insertRow();
            
            const numMesas = reserva.mesas.length;
            totalMesas += numMesas;

            row.insertCell().textContent = reserva.mesas.sort((a, b) => parseInt(a) - parseInt(b)).join(', '); // 0. Mesas
            row.insertCell().textContent = reserva.nome; // 1. Responsável
            row.insertCell().textContent = `${reserva.aluno} (${reserva.turma})`; // 2. Aluno/Turma
            // CADEIRAS EXTRAS REMOVIDO
            row.insertCell().textContent = `R$ ${reserva.valorTotal.toFixed(2).replace('.', ',')}`; // 3. Valor
            row.insertCell().textContent = `${reserva.data} ${reserva.horario}`; // 4. Data/Hora
            
            // Coluna STATUS
            const statusCell = row.insertCell();
            const status = reserva.status || 'pendente';
            const statusClass = status === 'confirmado' ? 'status-confirmado' : 'status-pendente';
            const statusText = status === 'confirmado' ? 'CONFIRMADO' : 'PENDENTE (PIX)';
            statusCell.innerHTML = `<span class="status-badge ${statusClass}">${statusText}</span>`;

            // Coluna AÇÃO
            const actionCell = row.insertCell();
            if (status === 'pendente') {
                const mesaPrincipal = reserva.mesas[0];
                actionCell.innerHTML = `<button class="confirm-button" onclick="confirmarPagamento('${mesaPrincipal}')">CONFIRMAR</button>`;
            } else {
                actionCell.textContent = '—';
            }
        });
        
        totalReservasSpan.textContent = totalMesas.toString();
        filtrarTabela(); 
    }

    headers.forEach((header, index) => {
        header.addEventListener('click', () => {
            if (sortColumn === index) {
                sortDirection = sortDirection === 'asc' ? 'desc' : 'asc';
            } else {
                sortColumn = index;
                sortDirection = 'desc';
            }
            ordenarTabela(sortColumn, sortDirection);
        });
    });
    
    // ----------------------------------------------------
    // FUNÇÃO DE EXPORTAÇÃO PARA PDF (CORRIGIDA)
    // ----------------------------------------------------

    window.exportarPDF = function() {
        const { jsPDF } = window.jspdf;
        // @ts-ignore
        const doc = new jsPDF('landscape');

        const tabela = document.getElementById('reservasTable');
        const linhasVisiveis = Array.from(tabela.querySelectorAll('tbody tr')).filter(row => row.style.display !== 'none');
        
        if (linhasVisiveis.length === 0) {
            alert("Não há dados visíveis para exportar.");
            return;
        }

        const cabecalhos = Array.from(tabela.querySelectorAll('thead th')).map(th => th.textContent.trim());
        cabecalhos.pop(); // Remove a coluna Ação
        cabecalhos.pop(); // Remove a coluna Status 

        const dados = linhasVisiveis.map(row => {
            const cells = Array.from(row.querySelectorAll('td'));
            // Pega o conteúdo de texto, excluindo as duas últimas colunas (Status e Ação)
            return cells.slice(0, -2).map(cell => cell.textContent.trim()); 
        });

        doc.setFontSize(16);
        doc.setTextColor(50, 50, 50); 
        doc.text("Relatório de Reservas - Traços Culturais", 140, 15, { align: "center" });
        doc.setFontSize(10);
        doc.text(`Reservas no Relatório: ${linhasVisiveis.length} transações`, 140, 22, { align: "center" });

        doc.autoTable({
            startY: 30,
            head: [cabecalhos],
            body: dados,
            theme: 'grid',
            styles: { fontSize: 8, cellPadding: 2, overflow: 'linebreak' },
            headStyles: { fillColor: [0, 123, 255], textColor: 255 } // Cor azul do tema
        });

        doc.save(`Reservas_Tracos_Culturais_${new Date().toLocaleDateString('pt-BR').replace(/\//g, '-')}.pdf`);
    }

    // ----------------------------------------------------
    // FUNÇÃO DE CONFIRMAÇÃO (MANTIDA)
    // ----------------------------------------------------
    window.confirmarPagamento = async function(mesaPrincipalId) {
        const confirmacao = confirm(`Tem certeza que deseja CONFIRMAR o pagamento para a reserva da MESA ${mesaPrincipalId}?`);
        
        if (confirmacao) {
            try {
                const reservaParaConfirmar = dadosAgrupados.find(r => r.mesas[0] === mesaPrincipalId);
                
                if (!reservaParaConfirmar) {
                    alert('Erro: Reserva não encontrada localmente.');
                    return;
                }

                const mesasIds = reservaParaConfirmar.mesas;
                const updates = {};
                
                // Manda a atualização de status para CADA mesa do grupo
                mesasIds.forEach(mesaId => {
                    updates[`/reservas/${mesaId}/status`] = 'confirmado';
                });

                // A função update no nó raiz (ref(db)) é o que requer a regra específica de escrita
                await update(ref(db), updates); 
                
                alert(`Pagamento CONFIRMADO para as mesas: ${mesasIds.join(', ')}.`);

            } catch (error) {
                // A mensagem de ERRO foi mantida para auxiliar no debug das regras
                if (error.code === 'PERMISSION_DENIED') {
                    alert("ERRO: O status não foi atualizado. Verifique se as novas Regras de Segurança foram PUBLICADAS no Firebase.");
                } else {
                    alert(`Erro ao confirmar pagamento: ${error.message}`);
                }
                console.error("Erro no Firebase:", error);
            }
        }
    }
    
    // ----------------------------------------------------
    // CONEXÃO COM FIREBASE (BUSCA INICIAL)
    // ----------------------------------------------------
    
    onValue(ref(db, "reservas"), (snapshot) => {
      loadingDiv.style.display = 'none';
      dadosAgrupados = [];

      const reservasData = snapshot.val();
      if (!reservasData) {
        renderizarTabela([]);
        return;
      }

      // Agrupamento de mesas continua necessário
      const reservasMap = new Map();

      for (const mesaId in reservasData) {
        const reserva = reservasData[mesaId];
        if (!reserva.status) reserva.status = 'pendente'; 
        
        // Chave de Agrupamento: Usa todos os dados para identificar uma reserva única
        const chaveReserva = `${reserva.aluno}-${reserva.nome}-${reserva.data}-${reserva.horario}-${reserva.valorTotal}`;
        
        if (!reservasMap.has(chaveReserva)) {
          reservasMap.set(chaveReserva, {
            ...reserva,
            mesas: [mesaId]
          });
        } else {
          reservasMap.get(chaveReserva).mesas.push(mesaId);
        }
      }
      
      dadosAgrupados = Array.from(reservasMap.values());
      ordenarTabela(sortColumn, sortDirection);

    }, (error) => {
      loadingDiv.textContent = `ERRO FATAL: ${error.message}.`;
      console.error("Firebase Error:", error);
    });
  </script>
</body>
</html>
